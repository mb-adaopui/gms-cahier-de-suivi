<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Grande Mosquee de Sartrouville</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Arial,sans-serif;background:#F8F7F4;color:#2D3748;overflow:hidden;height:100vh;}
#app{display:flex;flex-direction:column;height:100vh;max-width:680px;margin:0 auto;background:#F8F7F4;overflow:hidden;}
#topbar{background:#1B5E42;color:#fff;padding:0 12px;height:52px;display:none;flex-shrink:0;align-items:center;justify-content:space-between;gap:8px;}
#tb-left{display:flex;align-items:center;gap:8px;min-width:0;flex:1;overflow:hidden;}
#tb-logo{width:30px;height:30px;border-radius:50%;object-fit:cover;flex-shrink:0;}
#tb-name{font-weight:800;font-size:.82rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#tb-sub{font-size:.6rem;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#tb-right{display:flex;align-items:center;gap:6px;flex-shrink:0;}
#btn-menu{background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:6px;width:32px;height:32px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;}
#btn-menu span{display:block;width:14px;height:2px;background:#fff;border-radius:2px;}
#btn-exit{background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:6px;padding:4px 8px;font-family:inherit;font-size:.7rem;font-weight:700;cursor:pointer;}
#menu-ov{display:none;position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.4);}
#menu-box{position:absolute;top:52px;right:0;width:200px;background:#fff;border-radius:0 0 0 12px;box-shadow:-4px 6px 20px rgba(0,0,0,.2);overflow:hidden;}
#menu-hdr{background:#E8F5EE;padding:10px 14px;border-bottom:1px solid #E2E0DB;}
#menu-hdr-role{font-size:.66rem;font-weight:700;color:#1B5E42;text-transform:uppercase;}
#menu-hdr-name{font-size:.7rem;color:#4A5568;margin-top:2px;}
#menu-items{}
#menu-ftr{padding:8px 14px;background:#F8F7F4;border-top:1px solid #E2E0DB;font-size:.6rem;color:#718096;text-align:center;}
.mi{display:block;width:100%;padding:12px 16px;border:none;cursor:pointer;font-family:inherit;font-size:.86rem;text-align:left;background:transparent;border-left:3px solid transparent;border-bottom:1px solid rgba(226,224,219,.4);color:#2D3748;}
.mi.on{background:#E8F5EE;border-left-color:#1B5E42;font-weight:700;color:#1B5E42;}
.mbdg{float:right;background:#C0392B;color:#fff;border-radius:10px;font-size:.6rem;padding:1px 5px;font-weight:700;}
#content{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px;}
#login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;}
.lcard{background:#fff;border-radius:14px;padding:24px 20px;width:100%;max-width:360px;box-shadow:0 4px 20px rgba(27,94,66,.12);}
.lhdr{text-align:center;margin-bottom:16px;}
.lhdr img{width:80px;height:80px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 8px;}
.lhdr h1{color:#1B5E42;font-size:1rem;font-weight:800;margin:0 0 2px;}
.fg{margin-bottom:10px;}
.fg label{display:block;font-size:.68rem;font-weight:700;color:#4A5568;margin-bottom:3px;text-transform:uppercase;letter-spacing:.04em;}
.fg input,.fg select,.fg textarea{width:100%;padding:8px 10px;border:1.5px solid #E2E0DB;border-radius:7px;font-family:inherit;font-size:.86rem;background:#F8F7F4;color:#2D3748;}
.fg textarea{resize:vertical;min-height:60px;}
.hint{font-size:.64rem;color:#718096;margin-top:2px;}
.btn{display:inline-flex;align-items:center;gap:4px;padding:7px 12px;border-radius:7px;border:none;font-family:inherit;font-size:.8rem;font-weight:700;cursor:pointer;}
.bg{background:#1B5E42;color:#fff;}
.br{background:#C0392B;color:#fff;}
.bgr{background:#F8F7F4;color:#4A5568;border:1px solid #E2E0DB !important;}
.bbl{background:#1E3A5F;color:#fff;}
.bfull{width:100%;justify-content:center;padding:10px;}
.bsm{font-size:.72rem;padding:5px 9px;}
.card{background:#fff;border-radius:10px;border:1px solid #E2E0DB;padding:12px;margin-bottom:8px;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.bdg{display:inline-block;padding:2px 7px;border-radius:20px;font-size:.64rem;font-weight:700;text-transform:uppercase;white-space:nowrap;}
.atag{display:inline-block;padding:2px 7px;border-radius:20px;background:rgba(200,168,75,.15);color:#C8A84B;font-size:.64rem;font-weight:700;border:1px solid #C8A84B;}
.hr{border:none;border-top:1px solid #E2E0DB;margin:8px 0;}
.empty{text-align:center;padding:28px;color:#718096;font-size:.82rem;}
.fbtns{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:7px;}
.fbtn{padding:3px 8px;border-radius:20px;cursor:pointer;font-family:inherit;font-size:.64rem;font-weight:700;border:1.5px solid #E2E0DB;background:#fff;color:#4A5568;}
.fbtn.on{border-color:#1B5E42;background:#E8F5EE;color:#1B5E42;}
#modal-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:400;align-items:flex-end;justify-content:center;}
#modal-ov.open{display:flex;}
#modal-box{background:#fff;border-radius:14px 14px 0 0;width:100%;max-width:640px;max-height:86vh;overflow-y:auto;padding:16px 14px 24px;}
#modal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
#modal-ttl{font-size:.9rem;font-weight:800;color:#1B5E42;margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#modal-x{background:none;border:none;font-size:1.3rem;cursor:pointer;color:#718096;padding:0;}
#toast{display:none;position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:999;color:#fff;padding:8px 16px;border-radius:8px;font-weight:700;font-size:.8rem;white-space:nowrap;pointer-events:none;}
#toast.show{display:block;}
.secrow{padding:10px 12px;}
.sn{font-weight:700;font-size:.84rem;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sm{font-size:.62rem;color:#718096;margin-bottom:7px;display:flex;gap:5px;flex-wrap:wrap;align-items:center;}
.sb{display:flex;gap:6px;flex-wrap:wrap;}
.rttl{font-weight:700;font-size:.84rem;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rwho{font-size:.68rem;color:#1B5E42;font-weight:600;}
.rdt{font-size:.63rem;color:#718096;margin-top:1px;}
#invite-wrap{display:none;min-height:100vh;align-items:center;justify-content:center;padding:16px;background:#F8F7F4;}
#inv-banner{padding:8px 12px;border-radius:8px;margin-bottom:12px;text-align:center;font-weight:700;font-size:.84rem;}
</style>
</head>
<body>
<div id="app">

<div id="invite-wrap">
<div class="lcard">
<div class="lhdr">
<img id="inv-logo" src="" alt="logo"/>
<h1>Grande Mosquee de Sartrouville</h1>
<p style="color:#1B5E42;font-weight:700;font-size:.76rem;margin:2px 0;">Inscription Referent</p>
</div>
<div id="inv-banner"></div>
<div class="fg"><label>Nom complet</label><input id="inv-name" placeholder="Votre nom"/></div>
<div class="fg"><label>Email</label><input type="email" id="inv-email" placeholder="email@exemple.com"/></div>
<div class="fg"><label>Telephone</label><input type="tel" id="inv-phone" placeholder="06 xx xx xx xx"/></div>
<div class="fg"><label>Code secret (4 chiffres min.)</label><input type="password" id="inv-p1" maxlength="8" placeholder="Code secret"/></div>
<div class="fg"><label>Confirmer le code</label><input type="password" id="inv-p2" maxlength="8" placeholder="Confirmer"/></div>
<div id="inv-err" style="color:#C0392B;font-size:.76rem;margin-bottom:8px;display:none;"></div>
<button class="btn bg bfull" id="inv-btn">Finaliser mon inscription</button>
</div>
</div>

<div id="login-wrap">
<div class="lcard">
<div class="lhdr">
<img id="lg-logo" src="" alt="logo"/>
<h1>Grande Mosquee de Sartrouville</h1>
<p style="color:#1B5E42;font-weight:700;font-size:.76rem;margin:1px 0;">Cahier de Suivi</p>
<p style="color:#718096;font-size:.72rem;">ACMS - CCIS</p>
</div>
<div id="login-general">
<div class="fg"><label>Connexion</label><select id="l-uid"></select></div>
<div class="fg"><label>Code acces</label><input type="password" id="l-pin" placeholder="1234" maxlength="8"/><div class="hint">Code par defaut : 1234</div></div>
<div id="l-err" style="color:#C0392B;font-size:.76rem;margin-bottom:8px;display:none;"></div>
<button class="btn bg bfull" id="l-btn">Se connecter</button>
</div>
<div id="login-ref" style="display:none;">
<div id="lr-banner" style="padding:8px 12px;border-radius:8px;margin-bottom:12px;text-align:center;font-weight:700;font-size:.84rem;"></div>
<div class="fg"><label>Votre code secret</label><input type="password" id="l-pin-ref" placeholder="Code secret" maxlength="8"/></div>
<div id="l-err-ref" style="color:#C0392B;font-size:.76rem;margin-bottom:8px;display:none;"></div>
<button class="btn bg bfull" id="l-btn-ref">Se connecter</button>
<button class="btn bgr bfull" id="l-btn-other" style="margin-top:6px;font-size:.76rem;">Autre utilisateur</button>
</div>
</div>
</div>

<div id="topbar">
<div id="tb-left">
<img id="tb-logo" src="" alt="logo"/>
<div><div id="tb-name">Grande Mosquee de Sartrouville</div><div id="tb-sub"></div></div>
</div>
<div id="tb-right">
<button id="btn-menu"><span></span><span></span><span></span></button>
<button id="btn-exit" class="btn">Sortir</button>
</div>
</div>

<div id="menu-ov">
<div id="menu-box">
<div id="menu-hdr"><div id="menu-hdr-role"></div><div id="menu-hdr-name"></div></div>
<div id="menu-items"></div>
<div id="menu-ftr">Grande Mosquee de Sartrouville - ACMS/CCIS</div>
</div>
</div>

<div id="content" style="display:none;"></div>

<div id="modal-ov">
<div id="modal-box">
<div id="modal-hdr"><h3 id="modal-ttl"></h3><button id="modal-x">x</button></div>
<div id="modal-body"></div>
</div>
</div>

<div id="toast"></div>
</div>
